name: Update Donut Browser Version

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific version to update to (optional, without leading v)'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
        env:
          NIX_FIRST_BUILD_UID: 400

      - name: Check for updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ -n "${{ github.event.inputs.version }}" ]; then
            CHECK_OUTPUT=$(./scripts/update-version.sh --check --version "${{ github.event.inputs.version }}")
            CHECK_EXIT=$?
          else
            CHECK_OUTPUT=$(./scripts/update-version.sh --check)
            CHECK_EXIT=$?
          fi
          set -e

          # Exit codes from update-version.sh:
          #   0 = no update needed
          #   1 = update needed and ready to apply
          #   2 = update blocked (patches don't apply, build failed, etc.) — handled downstream
          if [ "$CHECK_EXIT" -ne 0 ] && [ "$CHECK_EXIT" -ne 1 ] && [ "$CHECK_EXIT" -ne 2 ]; then
            echo "$CHECK_OUTPUT"
            echo "update-version.sh failed with exit code $CHECK_EXIT"
            exit "$CHECK_EXIT"
          fi

          echo "$CHECK_OUTPUT"

          CURRENT_VERSION=$(echo "$CHECK_OUTPUT" | sed -n 's/^current_version=//p' | tail -1)
          LATEST_VERSION=$(echo "$CHECK_OUTPUT" | sed -n 's/^latest_version=//p' | tail -1)
          UPDATE_NEEDED=$(echo "$CHECK_OUTPUT" | sed -n 's/^update_needed=//p' | tail -1)
          UPDATE_BLOCKED=$(echo "$CHECK_OUTPUT" | sed -n 's/^update_blocked=//p' | tail -1)
          BLOCKED_REASON=$(echo "$CHECK_OUTPUT" | sed -n 's/^blocked_reason=//p' | tail -1)
          BLOCKED_VERSION=$(echo "$CHECK_OUTPUT" | sed -n 's/^blocked_version=//p' | tail -1)
          BLOCKED_PATCHES=$(echo "$CHECK_OUTPUT" | sed -n 's/^blocked_patches=//p' | tail -1)
          BLOCKED_DETAILS=$(echo "$CHECK_OUTPUT" | sed -n 's/^blocked_details=//p' | tail -1)
          REFRESH_COMMAND=$(echo "$CHECK_OUTPUT" | sed -n 's/^refresh_command=//p' | tail -1)

          if [ -z "$UPDATE_NEEDED" ]; then
            if [ "$CHECK_EXIT" -eq 1 ]; then
              UPDATE_NEEDED=true
            else
              UPDATE_NEEDED=false
            fi
          fi

          if [ -z "$UPDATE_BLOCKED" ]; then
            UPDATE_BLOCKED=false
          fi

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "latest_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "update_needed=$UPDATE_NEEDED" >> "$GITHUB_OUTPUT"
          echo "update_blocked=$UPDATE_BLOCKED" >> "$GITHUB_OUTPUT"
          echo "blocked_reason=$BLOCKED_REASON" >> "$GITHUB_OUTPUT"
          echo "blocked_version=$BLOCKED_VERSION" >> "$GITHUB_OUTPUT"
          echo "blocked_patches=$BLOCKED_PATCHES" >> "$GITHUB_OUTPUT"
          echo "blocked_details=$BLOCKED_DETAILS" >> "$GITHUB_OUTPUT"
          echo "refresh_command=$REFRESH_COMMAND" >> "$GITHUB_OUTPUT"

      - name: Report blocked update
        if: steps.check.outputs.update_blocked == 'true'
        run: |
          echo "Update skipped for version '${{ steps.check.outputs.blocked_version }}' because '${{ steps.check.outputs.blocked_reason }}' requires manual intervention."
          if [ -n "${{ steps.check.outputs.blocked_patches }}" ]; then
            echo "Blocking patches: ${{ steps.check.outputs.blocked_patches }}"
          fi
          if [ -n "${{ steps.check.outputs.blocked_details }}" ]; then
            echo "Details: ${{ steps.check.outputs.blocked_details }}"
          fi
          if [ -n "${{ steps.check.outputs.refresh_command }}" ]; then
            echo "Refresh command: ${{ steps.check.outputs.refresh_command }}"
          fi

      # --- Resilience (Option C): when an update is blocked, never fail
      # silently. For a recoverable "patches" block, auto-refresh the carried
      # patches and re-verify the full build; on success open a PR for review
      # (never push straight to main), and on any failure open/update a single
      # tracking issue so the stall is always visible.
      - name: Setup Cachix (auto-refresh)
        if: steps.check.outputs.update_blocked == 'true' && steps.check.outputs.blocked_reason == 'patches'
        uses: cachix/cachix-action@v17
        with:
          name: hassiyyt
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Recover from blocked update
        if: steps.check.outputs.update_blocked == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOCKED_REASON: ${{ steps.check.outputs.blocked_reason }}
          BLOCKED_VERSION: ${{ steps.check.outputs.blocked_version }}
          BLOCKED_PATCHES: ${{ steps.check.outputs.blocked_patches }}
          BLOCKED_DETAILS: ${{ steps.check.outputs.blocked_details }}
        run: |
          set -uo pipefail

          version="$BLOCKED_VERSION"
          branch="auto-update/v${version}"
          issue_title="Automated update to v${version} is blocked"

          # Idempotent issue helper: reuse an open issue with the same title.
          open_or_update_issue() {
            local body="$1"
            local existing
            existing=$(gh issue list --state open --search "in:title ${issue_title}" \
              --json number,title --jq ".[] | select(.title == \"${issue_title}\") | .number" | head -1)
            if [ -n "$existing" ]; then
              echo "Updating existing issue #${existing}"
              gh issue comment "$existing" --body "$body"
            else
              echo "Opening new tracking issue"
              gh issue create --title "$issue_title" --body "$body" --label "automated-update" \
                || gh issue create --title "$issue_title" --body "$body"
            fi
          }

          # Non-patch blocks (build/playwright-driver/source-layout) need manual
          # package.nix work a patch refresh cannot produce. Surface and stop.
          if [ "$BLOCKED_REASON" != "patches" ]; then
            open_or_update_issue "$(printf 'The hourly updater could not advance to **v%s**.\n\n- Reason: `%s`\n- Details: %s\n\nThis needs a manual change (likely to `package.nix`) before the update can proceed.\n\n_Filed automatically by the update workflow._' "$version" "$BLOCKED_REASON" "${BLOCKED_DETAILS:-n/a}")"
            echo "Opened tracking issue for non-patch block '$BLOCKED_REASON'."
            exit 0
          fi

          echo "Attempting automatic patch refresh against v${version}..."
          if ! ./scripts/refresh-patches.sh --version "$version"; then
            open_or_update_issue "$(printf 'The hourly updater could not auto-refresh carried patches for **v%s**.\n\n- Blocking patches: `%s`\n\nThese hunks need manual resolution against upstream v%s, then run:\n\n```\n./scripts/refresh-patches.sh --version %s\n./scripts/update-version.sh --version %s\n```\n\n_Filed automatically by the update workflow._' "$version" "${BLOCKED_PATCHES:-unknown}" "$version" "$version" "$version")"
            echo "Patch refresh failed; opened tracking issue."
            exit 0
          fi

          echo "Patches refreshed. Re-running updater (bump + full build verify)..."
          if ! ./scripts/update-version.sh --version "$version"; then
            open_or_update_issue "$(printf 'Carried patches were auto-refreshed for **v%s**, but the subsequent `update-version.sh` (bump + full build) failed.\n\nThis usually means upstream changed packaging in a way that needs a manual `package.nix` edit (e.g. a removed/added sidecar binary or a new build dependency).\n\nThe refreshed patches are ready; finish locally with:\n\n```\n./scripts/update-version.sh --version %s\n```\n\n_Filed automatically by the update workflow._' "$version" "$version")"
            echo "update-version.sh failed after refresh; opened tracking issue."
            exit 0
          fi

          echo "Build verified. Pushing to Cachix and opening a PR for review..."
          out_paths="$(nix build .#donutbrowser --json --print-build-logs | jq -r '.[].outputs.out')"
          printf '%s\n' "$out_paths" | cachix push hassiyyt || echo "Cachix push failed (non-fatal); continuing to PR."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add package.nix patches flake.lock 2>/dev/null || git add package.nix patches
          git commit -m "chore: update donutbrowser to version ${version} (auto-refreshed patches)"
          git push --force origin "HEAD:${branch}"

          pr_body="$(printf 'Automated update to **v%s** with auto-refreshed carried patches.\n\nThe hourly updater was blocked because carried patches no longer applied; `refresh-patches.sh` reconciled them and the full `nix build .#donutbrowser` passed in CI.\n\n**Please review the refreshed patch hunks** before merging — a 3-way merge can apply cleanly yet shift intent.\n\n_Opened automatically by the update workflow._' "$version")"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "chore: update donutbrowser to version ${version}" \
              --body "$pr_body"
          else
            echo "PR for ${branch} already open; branch updated by force-push."
          fi

      - name: Update package
        if: steps.check.outputs.update_needed == 'true' && steps.check.outputs.update_blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            ./scripts/update-version.sh --version "${{ github.event.inputs.version }}"
          else
            ./scripts/update-version.sh
          fi

      - name: Setup Cachix
        if: steps.check.outputs.update_needed == 'true' && steps.check.outputs.update_blocked != 'true'
        uses: cachix/cachix-action@v17
        with:
          name: hassiyyt
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build and push updated package to Cachix
        if: steps.check.outputs.update_needed == 'true' && steps.check.outputs.update_blocked != 'true'
        run: |
          set -euo pipefail
          out_paths="$(nix build .#donutbrowser --json --print-build-logs | jq -r '.[].outputs.out')"
          printf '%s\n' "$out_paths" | cachix push hassiyyt

      - name: Commit and push update
        if: steps.check.outputs.update_needed == 'true' && steps.check.outputs.update_blocked != 'true'
        run: |
          if git diff --quiet; then
            echo "No file changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add flake.lock package.nix
          git commit -m "chore: update donutbrowser to version ${{ steps.check.outputs.latest_version }}"
          git push origin HEAD:main
